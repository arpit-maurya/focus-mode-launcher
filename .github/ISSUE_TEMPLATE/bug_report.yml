name: 🐛 Bug Report
description: File a bug report to help improve Distraction-Free Launcher
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: device
    attributes:
      label: Device & Android Version
      description: e.g. Pixel 8 Pro, Android 15 (API 35) or Samsung Galaxy S24, One UI 6.1
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open Home screen
        2. Tap Focus toggle
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste logcat snippet or attach screenshots if available.
